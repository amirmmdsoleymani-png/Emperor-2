<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#080d18">
<title>امپراتوری | عصر قدرت</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;500;600;700;800;900&display=swap');
:root{--bg:#080d18;--panel:#111a2b;--panel2:#0b1322;--line:#263550;--text:#e8edf7;--muted:#91a0b8;--gold:#f2c46d;--gold2:#b88738;--blue:#7587ff;--green:#40d6a1;--red:#ff667c;--shadow:0 18px 50px #0005}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
body{font-family:Vazirmatn,Tahoma,sans-serif;background:radial-gradient(ellipse at 12% 0%,#24366a55,transparent 34%),radial-gradient(ellipse at 90% 90%,#704a2350,transparent 30%),var(--bg);color:var(--text);min-height:100vh;line-height:1.7}
body:before{content:"";position:fixed;inset:0;pointer-events:none;opacity:.12;background-image:linear-gradient(#fff1 1px,transparent 1px),linear-gradient(90deg,#fff1 1px,transparent 1px);background-size:38px 38px;mask-image:linear-gradient(to bottom,#000,transparent 85%)}
button,input,textarea,select{font:inherit}button{cursor:pointer;border:1px solid transparent;border-radius:11px;padding:10px 15px;color:white;background:linear-gradient(135deg,#7787ff,#4d5be0);font-weight:700;transition:.18s;box-shadow:0 5px 16px #4d5be022}button:hover{filter:brightness(1.12);transform:translateY(-1px)}button:active{transform:scale(.98)}button.gray{background:#26344b;border-color:#3a4a63;box-shadow:none}button.red{background:#a82d43;box-shadow:none}button.gold{background:linear-gradient(135deg,#f4d18b,#a9762e);color:#17120a}button.small{padding:6px 10px;font-size:12px}
input,textarea,select{width:100%;background:#080f1d;border:1px solid #2b3a54;border-radius:10px;padding:11px 12px;color:var(--text);outline:none;margin:5px 0 9px}input:focus,textarea:focus,select:focus{border-color:var(--blue);box-shadow:0 0 0 3px #7587ff18}textarea{min-height:90px;resize:vertical}
a{color:#b7c2ff}.wrap{max-width:1120px;margin:auto;padding:0 14px 36px}
header{position:sticky;top:0;z-index:10;margin:0 -14px 18px;padding:12px 16px;background:#080d18eF;backdrop-filter:blur(16px);border-bottom:1px solid #34425b;display:flex;align-items:center;justify-content:space-between;gap:12px}
.brand{display:flex;align-items:center;gap:11px}.crest{width:44px;height:44px;border-radius:14px;display:grid;place-items:center;background:linear-gradient(145deg,#f6d78d,#90632a);color:#17120b;font-size:25px;box-shadow:0 6px 25px #d8a95022}.brand h1{font-size:17px;line-height:1.2}.brand small{color:var(--muted);font-size:10px;letter-spacing:1px}.nav{display:flex;gap:7px}.nav button{background:transparent;border-color:#2d3b52;color:#aab5c9;box-shadow:none;padding:8px 12px}.nav button.active{background:#5667e6;color:white;border-color:#7787ff}
.hero{border:1px solid #5b4b2e;border-radius:20px;padding:22px;background:linear-gradient(115deg,#161d31ed,#171b2aee 55%,#33271a);box-shadow:var(--shadow);position:relative;overflow:hidden;margin-bottom:14px}.hero:after{content:"♜";position:absolute;left:18px;top:-42px;font-size:180px;color:#f2c46d0b;line-height:1}.eyebrow{color:var(--gold);font-size:11px;font-weight:800;letter-spacing:1.5px}.hero h2{font-size:clamp(22px,4vw,34px);margin:3px 0 5px}.hero p{color:#aeb9cd;max-width:650px;font-size:13px}.hero-line{height:1px;background:linear-gradient(90deg,transparent,#b8873877,transparent);margin-top:18px}
.grid{display:grid;grid-template-columns:repeat(12,minmax(0,1fr));gap:13px}.card{grid-column:span 12;background:linear-gradient(145deg,#141e30f5,#0e1727f7);border:1px solid var(--line);border-radius:16px;padding:16px;box-shadow:0 10px 30px #0002;min-width:0}.half{grid-column:span 6}.third{grid-column:span 4}.card h3{font-size:14px;color:#c3ccff;margin-bottom:12px;display:flex;align-items:center;gap:8px}.card h3:before{content:"";display:inline-block;width:3px;height:16px;border-radius:3px;background:var(--gold)}.muted{color:var(--muted);font-size:12px}.row{display:flex;align-items:center;justify-content:space-between;gap:9px;flex-wrap:wrap}.row>*{min-width:0}.stat-grid{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:8px}.stat{background:#080f1c;border:1px solid #25334a;border-radius:12px;padding:10px}.stat span{display:block;color:var(--muted);font-size:11px}.stat strong{font-size:20px;color:#f2d18c}.bar{height:5px;background:#26334a;border-radius:9px;margin-top:7px;overflow:hidden}.bar i{display:block;height:100%;background:linear-gradient(90deg,#5968e6,#9aa5ff);border-radius:9px}.countries{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:9px}.country{position:relative;min-height:115px;border:1px solid #33435c;border-radius:14px;background:linear-gradient(145deg,#142037,#0a1220);display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:10px;cursor:pointer;transition:.2s}.country:hover{border-color:var(--gold);transform:translateY(-2px);box-shadow:0 8px 24px #0003}.country.taken{opacity:.5;cursor:not-allowed}.flag{font-size:31px;line-height:1.2}.country b{font-size:12px;margin-top:5px}.country small{font-size:10px;color:var(--muted)}.badge{display:inline-block;border-radius:20px;padding:3px 8px;font-size:10px;background:#29364d;color:#b7c4da}.badge.wait{background:#4a391b;color:#ffdc91}.badge.ok{background:#123e35;color:#76edc5}.item{padding:12px;background:#091220;border:1px solid #26354c;border-right:3px solid var(--gold2);border-radius:11px;margin:8px 0;font-size:13px;overflow-wrap:anywhere}.item.ok{border-right-color:var(--green)}.item .meta{font-size:10px;color:var(--muted);display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap;margin-bottom:5px}.item p{white-space:pre-wrap}.empty{text-align:center;padding:20px;color:var(--muted);font-size:12px;border:1px dashed #293950;border-radius:12px}.actions{display:flex;gap:7px;flex-wrap:wrap}.actions button{flex:1}.error{color:#ff8b9b;font-size:12px;min-height:20px}.success{color:#76edc5;font-size:12px;min-height:20px}.tablewrap{overflow-x:auto}table{border-collapse:collapse;width:100%;font-size:12px}th,td{text-align:right;padding:9px;border-bottom:1px solid #29364b;white-space:nowrap}th{color:#b9c4da;font-weight:700}td{color:#dce3f0}.admin-tools{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}.footer{text-align:center;color:#66758d;font-size:10px;padding:24px 0 5px}
@media(max-width:700px){.half,.third{grid-column:span 12}.countries{grid-template-columns:repeat(2,minmax(0,1fr))}.stat-grid{grid-template-columns:repeat(2,minmax(0,1fr))}.brand h1{font-size:15px}.nav button{padding:7px 9px;font-size:12px}.hero{padding:17px}.card{padding:13px}}
</style>
</head>
<body><div class="wrap">
<header><div class="brand"><div class="crest">♜</div><div><h1>امپراتوری</h1><small>AGE OF POWER · STRATEGY SIMULATION</small></div></div><div class="nav"><button id="navGame" class="active">بازی</button><button id="navAdmin">فرماندهی</button></div></header>
<main id="app"><div class="empty">در حال برقراری ارتباط با سرور...</div></main>
<div class="footer">امپراتوری · نسخه سرورمحور · تصمیم‌ها ثبت می‌شوند و برای همه بازیکنان همگام‌سازی خواهند شد</div>
</div>
<script>
const $=s=>document.querySelector(s);
let state={me:null,countries:[],actions:[],news:[],users:[],admin:false,view:'game'};
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const date=t=>{try{return new Date(t).toLocaleString('fa-IR')}catch{return ''}};
async function api(path,opts={}){const r=await fetch('/api'+path,{credentials:'same-origin',headers:{'Content-Type':'application/json',...(opts.headers||{})},...opts});let d={};try{d=await r.json()}catch{}if(!r.ok)throw Error(d.error||'خطای ارتباط با سرور');return d}
function hero(kicker,title,desc){return `<section class="hero"><div class="eyebrow">${kicker}</div><h2>${title}</h2><p>${desc}</p><div class="hero-line"></div></section>`}
function card(title,body,cls=''){return `<section class="card ${cls}"><h3>${title}</h3>${body}</section>`}
function stat(name,val){return `<div class="stat"><span>${name}</span><strong>${val}</strong><div class="bar"><i style="width:${Math.max(0,Math.min(100,val))}%"></i></div></div>`}
async function refresh(){const d=await api('/state');state.me=d.me;state.countries=d.countries;state.actions=d.actions;state.news=d.news;state.admin=d.admin;state.users=d.users||[];render()}
function render(){ $('#navGame').classList.toggle('active',state.view==='game');$('#navAdmin').classList.toggle('active',state.view==='admin');$('#app').innerHTML=state.view==='admin'?adminPage():gamePage();bind()}
function gamePage(){
 if(!state.me)return hero('WELCOME · BUILD YOUR LEGACY','جهان در انتظار تصمیم توست','وارد شو یا حساب بساز، سپس کشورت را انتخاب کن و سرنوشت امپراتوری را رقم بزن.')+authCard();
 const mine=state.countries.find(c=>c.owner_id===state.me.id);
 if(!mine){let cs=state.countries.map(c=>`<div class="country ${c.owner_id?'taken':''}" data-claim="${c.id}"><div class="flag">${c.flag}</div><b>${esc(c.name)}</b><small>${c.owner_id?'در اختیار بازیکن':'آماده انتخاب'}</small></div>`).join('');return hero('CHOOSE YOUR NATION','کشور خود را انتخاب کن','هر کشور تنها یک فرمانروا دارد. انتخاب تو آغاز مسیر سیاسی، اقتصادی و نظامی توست.')+card('نقشه قدرت‌ها',`<div class="countries">${cs}</div><p class="muted" style="margin-top:12px">کشورهای اشغال‌شده تا زمان آزادسازی توسط ادمین قابل انتخاب نیستند.</p>`)}
 const s=mine.stats,power=Object.values(s).reduce((a,b)=>a+b,0),mineActions=state.actions.filter(a=>a.player_id===state.me.id);
 const pending=mineActions.some(a=>a.status==='pending');
 const ah=mineActions.length?mineActions.map(a=>`<div class="item ${a.status==='answered'?'ok':''}"><div class="meta"><span>${date(a.created_at)}</span><span class="badge ${a.status==='pending'?'wait':'ok'}">${a.status==='pending'?'در انتظار بررسی':'پاسخ ادمین'}</span></div><p>${esc(a.text)}</p>${a.result?`<div style="margin-top:8px;color:#9cebd0"><b>نتیجه:</b> ${esc(a.result)}</div>`:''}</div>`).join(''):'<div class="empty">هنوز اقدامی ثبت نکرده‌ای.</div>';
 const nh=state.news.length?state.news.map(n=>`<div class="item" style="border-right-color:var(--blue)"><div class="meta">${date(n.created_at)}</div><p>${esc(n.text)}</p></div>`).join(''):'<div class="empty">هنوز خبری منتشر نشده است.</div>';
 return hero('COMMANDER DASHBOARD','${TITLE}','کشورت را مدیریت کن، اقدام بفرست و واکنش جهان را دنبال کن.'.replace('${TITLE}',esc(mine.flag+' '+mine.name)))+
 card('وضعیت کشور',`<div class="row" style="margin-bottom:12px"><div><div class="muted">فرمانروا</div><b>${esc(state.me.username)}</b></div><div style="text-align:left"><div class="muted">قدرت کل</div><strong style="font-size:25px;color:var(--gold)">${power}</strong></div></div><div class="stat-grid">${stat('ثروت',s.wealth)}${stat('توان نظامی',s.military)}${stat('فناوری',s.tech)}${stat('رضایت',s.happiness)}${stat('ثبات',s.stability)}</div><div style="margin-top:12px"><button class="gray small" id="logout">خروج از حساب</button></div>`)+
 card('ثبت اقدام جدید',pending?'<div class="empty">یک اقدام در انتظار پاسخ است. پس از پاسخ ادمین می‌توانی اقدام بعدی را ثبت کنی.</div>':`<form id="actionForm"><label class="muted">فرمان یا تصمیم سیاسی، اقتصادی یا نظامی</label><textarea id="actionText" maxlength="3000" required placeholder="مثلاً: دولت طرحی برای توسعه راه‌آهن و افزایش تجارت منطقه‌ای تصویب می‌کند..."></textarea><button style="width:100%">ثبت فرمان در دبیرخانه</button><div id="actionMsg" class="error"></div></form>`,'half')+
 card('تاریخچه اقدامات',ah,'half')+card('خبرهای امپراتوری',nh);
}
function authCard(){return `<div class="grid"><section class="card half"><h3>ورود به حساب</h3><form id="loginForm"><input name="username" minlength="3" maxlength="24" placeholder="نام کاربری" required><input name="password" type="password" placeholder="رمز عبور" required><button style="width:100%">ورود</button><div class="error" id="loginMsg"></div></form></section><section class="card half"><h3>ساخت حساب جدید</h3><form id="registerForm"><input name="username" minlength="3" maxlength="24" placeholder="نام کاربری (۳ تا ۲۴ حرف)" required><input name="password" type="password" minlength="8" placeholder="رمز عبور (حداقل ۸ نویسه)" required><button class="gold" style="width:100%">ثبت‌نام و ورود</button><div class="error" id="registerMsg"></div></form></section></div>`}
function adminPage(){
 if(!state.admin)return hero('RESTRICTED ACCESS','مرکز فرماندهی','ورود مدیر فقط با حسابی که از طریق تنظیمات امن سرور ایجاد شده باشد امکان‌پذیر است.')+`<section class="card" style="max-width:520px;margin:auto"><h3>ورود مدیر</h3><form id="adminLogin"><input name="username" placeholder="نام کاربری مدیر" required><input name="password" type="password" placeholder="رمز عبور مدیر" required><button class="gold" style="width:100%">ورود به مرکز فرماندهی</button><div class="error" id="adminMsg"></div></form></section>`;
 const pending=state.actions.filter(a=>a.status==='pending'),answered=state.actions.filter(a=>a.status==='answered');
 const pendHtml=pending.length?pending.map(a=>`<div class="item"><div class="meta"><span>${esc(a.username)} · ${esc(a.country_name||'بدون کشور')}</span><span>${date(a.created_at)}</span></div><p>${esc(a.text)}</p><form class="answerForm" data-id="${a.id}"><textarea name="result" maxlength="3000" required placeholder="نتیجه، واکنش‌ها و تغییرات..."></textarea><button>ثبت نتیجه و ارسال برای بازیکن</button></form></div>`).join(''):'<div class="empty">اقدام در انتظار پاسخ نیست.</div>';
 const users=state.users.map(u=>{let c=state.countries.find(x=>x.owner_id===u.id);return `<tr><td>${esc(u.username)}</td><td>${c?esc(c.flag+' '+c.name):'بدون کشور'}</td><td>${u.role==='admin'?'مدیر':'بازیکن'}</td><td><button class="small gray" data-reset="${u.id}">آزادسازی کشور</button> <button class="small red" data-deleteuser="${u.id}">حذف حساب</button></td></tr>`}).join('');
 const countries=state.countries.map(c=>`<tr><td>${c.flag} ${esc(c.name)}</td><td>${c.owner_username?esc(c.owner_username):'آزاد'}</td><td>${Object.values(c.stats).reduce((a,b)=>a+b,0)}</td><td><button class="small gray" data-free="${c.id}">آزادسازی</button> <button class="small gray" data-editcountry="${c.id}">تنظیم آمار</button></td></tr>`).join('');
 return hero('HIGH COMMAND · ADMINISTRATOR','مرکز فرماندهی کل','مدیریت کامل بازیکنان، کشورها، اقدامات، اخبار و آمار بازی.')+
 `<div class="grid">${card('نمای کلی',`<div class="stat-grid">${stat('بازیکنان',state.users.filter(u=>u.role!=='admin').length)}${stat('اقدامات باز',pending.length)}${stat('پاسخ‌داده‌شده',answered.length)}${stat('اخبار',state.news.length)}${stat('کشورها',state.countries.length)}</div><div style="margin-top:12px"><button class="gray small" id="adminLogout">خروج مدیر</button></div>`)+
 card('انتشار خبر سراسری',`<form id="newsForm"><textarea name="text" maxlength="3000" required placeholder="خبر رسمی امپراتوری..."></textarea><button class="gold">انتشار برای همه بازیکنان</button><div class="error" id="newsMsg"></div></form>`,'half')+
 card(`اقدامات در انتظار (${pending.length})`,pendHtml)+
 card('مدیریت کاربران',`<div class="tablewrap"><table><thead><tr><th>نام کاربری</th><th>کشور</th><th>نقش</th><th>عملیات</th></tr></thead><tbody>${users||'<tr><td colspan="4">کاربری نیست</td></tr>'}</tbody></table></div>`)+
 card('مدیریت کشورها',`<div class="tablewrap"><table><thead><tr><th>کشور</th><th>فرمانروا</th><th>قدرت کل</th><th>عملیات</th></tr></thead><tbody>${countries}</tbody></table></div>`)+
 card('پاسخ‌های اخیر',answered.slice(0,12).map(a=>`<div class="item ok"><div class="meta">${esc(a.username)} · ${esc(a.country_name||'')} · ${date(a.created_at)}</div><p>${esc(a.text)}</p><div style="margin-top:6px;color:#9cebd0">نتیجه: ${esc(a.result||'')}</div><button class="small red" data-deleteaction="${a.id}" style="margin-top:8px">حذف اقدام</button></div>`).join('')||'<div class="empty">پاسخی ثبت نشده است.</div>')}</div>`;
}
function bind(){
 $('#navGame').onclick=()=>{state.view='game';render()};$('#navAdmin').onclick=()=>{state.view='admin';render()};
 const login=$('#loginForm');if(login)login.onsubmit=async e=>{e.preventDefault();try{await api('/login',{method:'POST',body:JSON.stringify(Object.fromEntries(new FormData(login)))});await refresh()}catch(x){$('#loginMsg').textContent=x.message}};
 const reg=$('#registerForm');if(reg)reg.onsubmit=async e=>{e.preventDefault();try{await api('/register',{method:'POST',body:JSON.stringify(Object.fromEntries(new FormData(reg)))});await refresh()}catch(x){$('#registerMsg').textContent=x.message}};
 const al=$('#adminLogin');if(al)al.onsubmit=async e=>{e.preventDefault();try{await api('/login',{method:'POST',body:JSON.stringify(Object.fromEntries(new FormData(al)))});await refresh()}catch(x){$('#adminMsg').textContent=x.message}};
 const logout=$('#logout');if(logout)logout.onclick=async()=>{await api('/logout',{method:'POST'});await refresh()};
 const alog=$('#adminLogout');if(alog)alog.onclick=async()=>{await api('/logout',{method:'POST'});await refresh()};
 document.querySelectorAll('[data-claim]').forEach(el=>el.onclick=async()=>{try{await api('/countries/'+el.dataset.claim+'/claim',{method:'POST'});await refresh()}catch(e){alert(e.message)}});
 const af=$('#actionForm');if(af)af.onsubmit=async e=>{e.preventDefault();try{await api('/actions',{method:'POST',body:JSON.stringify({text:$('#actionText').value})});await refresh()}catch(x){$('#actionMsg').textContent=x.message}};
 const nf=$('#newsForm');if(nf)nf.onsubmit=async e=>{e.preventDefault();try{await api('/news',{method:'POST',body:JSON.stringify(Object.fromEntries(new FormData(nf)))});await refresh()}catch(x){$('#newsMsg').textContent=x.message}};
 document.querySelectorAll('.answerForm').forEach(f=>f.onsubmit=async e=>{e.preventDefault();try{await api('/actions/'+f.dataset.id+'/answer',{method:'POST',body:JSON.stringify({result:new FormData(f).get('result')})});await refresh()}catch(x){alert(x.message)}});
 document.querySelectorAll('[data-free],[data-reset]').forEach(b=>b.onclick=async()=>{if(!confirm('کشور این بازیکن آزاد شود؟'))return;try{if(b.dataset.free)await api('/admin/countries/'+b.dataset.free+'/release',{method:'POST'});else await api('/admin/users/'+b.dataset.reset+'/release',{method:'POST'});await refresh()}catch(e){alert(e.message)}});
 document.querySelectorAll('[data-deleteuser]').forEach(b=>b.onclick=async()=>{if(!confirm('این حساب حذف شود؟ این کار قابل بازگشت نیست.'))return;try{await api('/admin/users/'+b.dataset.deleteuser,{method:'DELETE'});await refresh()}catch(e){alert(e.message)}});
 document.querySelectorAll('[data-deleteaction]').forEach(b=>b.onclick=async()=>{if(!confirm('این اقدام حذف شود؟'))return;try{await api('/admin/actions/'+b.dataset.deleteaction,{method:'DELETE'});await refresh()}catch(e){alert(e.message)}});
 document.querySelectorAll('[data-editcountry]').forEach(b=>b.onclick=async()=>{const c=state.countries.find(x=>x.id===b.dataset.editcountry);const keys=['wealth','military','tech','happiness','stability'];const labels=['ثروت','توان نظامی','فناوری','رضایت','ثبات'];let stats={};for(let i=0;i<keys.length;i++){let v=prompt(labels[i]+' (۰ تا ۱۰۰)',c.stats[keys[i]]);if(v===null)return;v=Number(v);if(!Number.isInteger(v)||v<0||v>100){alert('عدد باید بین ۰ تا ۱۰۰ باشد');return}stats[keys[i]]=v}try{await api('/admin/countries/'+c.id+'/stats',{method:'PATCH',body:JSON.stringify({stats})});await refresh()}catch(e){alert(e.message)}});
}
refresh().catch(e=>{$('#app').innerHTML=hero('CONNECTION ERROR','سرور در دسترس نیست','برای اجرای بازی، راهنمای README را دنبال کن.')+`<section class="card"><p class="error">${esc(e.message)}</p><button onclick="location.reload()">تلاش دوباره</button></section>`});
setInterval(()=>{if(document.visibilityState==='visible')refresh().catch(()=>{})},12000);
</script></body></html>
